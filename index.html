<!DOCTYPE html>
<html>
<head>
<style>
  body { 
    background-color: #001100; /* Deep Command Center Green */
    color: #00ff00; /* Classic Terminal Green */
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  /* The "Scanline" Effect - No Functions Needed! */
  .screen::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }

  .dashboard {
    border: 2px solid #00ff00;
    margin: 20px;
    padding: 20px;
    height: 90vh;
  }

  .mentor {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 250px; /* Placeholder for your Dummy 13 Photo */
  }

  .mission-box {
    border: 1px dashed #00ff00;
    padding: 10px;
    margin-top: 20px;
  }
</style>
</head>
<body class="screen">

<div class="dashboard">
  <h1>[ GRITHEROUS MISSION CONTROL ]</h1>
  <hr>
  
  <h3>> UPLINK STATUS: ONLINE</h3>
  <h3>> MENTOR: DUMMY 13</h3>

  <div class="mission-box">
    <h2>CURRENT MISSION:</h2>
    <p>Build a shelter for a Gritherous scout using only 5 items from your kitchen.</p>
  </div>

  <div class="mission-box">
    <h2>JOKE OF THE DAY:</h2>
    <p>Why did the Dummy 13 cross the road? Because his joints were programmed to move that way!</p>
  </div>

  <img src="dummy13.png" alt="Mentor" class="mentor">
</div>

</body>
</html>
