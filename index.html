<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON | GLOBAL COMMAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ds: #0D0D0E; --red: #FF3131; --blue: #00D4FF; }
        body { background: var(--ds); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; text-align: center; }
  
        /* The "Scanning" Animation */
        #loader { color: var(--blue); font-size: 1.2rem; letter-spacing: 2px; }
        .hidden { display: none; }
  
        .recruit-id { font-size: 3rem; color: var(--red); text-shadow: 0 0 20px var(--red); margin: 20px 0; }
        .glow-box { border: 1px solid var(--blue); padding: 40px; background: rgba(0, 212, 255, 0.05); box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.1); }
    </style>
</head>
<body>
  
    <div class="wrapper">
        <div id="loader">SCANNING BIO-SIGNATURES...</div>
  
        <div id="main-ui" class="hidden">
            <div class="glow-box">
                <div style="color: var(--blue);">IDENTITY CONFIRMED</div>
                <div class="recruit-id" id="recruitDisplay">RC-000</div>
                <div style="letter-spacing: 5px;">SQUAD LEADER STATUS: ACTIVE</div>
            </div>
        </div>
    </div>
  
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  
        // YOUR FIREBASE CONFIGURATION WITH CORRECTED DATABASE URL
        const firebaseConfig = { 
            apiKey: "AIzaSyBWimxqwAoKlLkz0vrFZsZNSzFCu6ZmaDo", 
            authDomain: "axon-command-center.firebaseapp.com", 
            // FIXED URL: Using the simpler, project-only format
            databaseURL: "https://axon-command-center.firebaseio.com", 
            projectId: "axon-command-center", 
            storageBucket: "axon-command-center.firebasestorage.app", 
            messagingSenderId: "785467628797", 
            appId: "1:785467628797:web:5d8100a690b89a163bb294", 
            measurementId: "G-90KXHXFSY6" 
        };
  
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
  
        async function assignRecruitNumber() {
            // Check if this kid already has a number saved in this browser
            let savedID = localStorage.getItem('axon_global_id');
  
            if (savedID) {
                showUI(savedID);
            } else {
                // If new, use a Transaction to update the global count safely
                const countRef = ref(db, 'globalCount');
  
                runTransaction(countRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                }).then((result) => {
                    const newNumber = result.snapshot.val();
                    const formattedID = `RC-${newNumber.toString().padStart(3, '0')}`;
                    localStorage.setItem('axon_global_id', formattedID);
                    showUI(formattedID);
                });
            }
        }
  
        function showUI(id) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('recruitDisplay').innerText = id;
        }
  
        assignRecruitNumber();
    </script>
</body>
</html>
