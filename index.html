<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GritHeroes.vip - Axon Universe</title>
    <style>
        :root {
            --sun-color: #ffcc00;
            --star-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a0a2a 0%, #000000 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* --- Starry Background --- */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 0;
        }

        /* --- The Sun --- */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            background: var(--sun-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px var(--sun-color), 0 0 100px orange;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-shadow: 0 0 5px black;
        }

        /* --- Orbit Container --- */
        .universe-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Planets (Buttons) --- */
        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rotate linear infinite;
        }

        .planet-btn {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid white;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            white-space: nowrap;
        }

        .planet-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px white;
        }

        /* --- Individual Orbits --- */
        .orbit-1 { width: 250px; height: 250px; animation-duration: 10s; }
        .orbit-2 { width: 400px; height: 400px; animation-duration: 15s; }
        .orbit-3 { width: 550px; height: 550px; animation-duration: 20s; }
        .orbit-4 { width: 700px; height: 700px; animation-duration: 25s; }
        .orbit-5 { width: 850px; height: 850px; animation-duration: 30s; }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Simple Shooting Star simulation */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 0 0 10px 2px white;
            animation: shoot 3s infinite;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(500px, 500px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="universe-container">
        <div class="sun">GRIT</div>

        <div class="orbit orbit-1">
            <a href="academy.html" class="planet-btn">Academy</a>
        </div>
        
        <div class="orbit orbit-2">
            <a href="chat.html" class="planet-btn">Chat</a>
        </div>

        <div class="orbit orbit-3">
            <a href="hall.html" class="planet-btn">Hall</a>
        </div>

        <div class="orbit orbit-4">
            <a href="news.html" class="planet-btn">News</a>
        </div>

        <div class="orbit orbit-5">
            <a href="shop.html" class="planet-btn">Shop</a>
        </div>
    </div>

    <div class="shooting-star" style="top: 10%; left: 30%;"></div>
    <div class="shooting-star" style="top: 50%; left: 80%; animation-delay: 1.5s;"></div>

</body>
</html>
