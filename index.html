<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON | Grit Heroes VIP</title>
    <style>
        :root { --axon-blue: #00d4ff; --bg-dark: #050505; }
        body { background: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        
        header { margin-top: 40px; text-align: center; }
        h1 { color: var(--axon-blue); letter-spacing: 5px; text-shadow: 0 0 15px var(--axon-blue); margin-bottom: 5px; }
        .slogan { font-size: 0.8rem; letter-spacing: 2px; color: #888; text-transform: uppercase; }

        /* The Neural Map Grid */
        .neural-map {
            position: relative; width: 90vw; max-width: 600px; height: 500px; margin-top: 20px;
        }

        .alias {
            position: absolute; border: 2px solid var(--axon-blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; text-align: center;
            background: rgba(0, 212, 255, 0.05); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            transition: 0.4s; cursor: pointer; text-decoration: none; color: white;
        }

        .alias:hover { box-shadow: 0 0 30px var(--axon-blue); background: rgba(0, 212, 255, 0.2); transform: scale(1.1); }

        /* Match your hand-drawn sketch positions */
        .hall { width: 140px; height: 140px; top: 10%; left: 0%; }
        .academy { width: 130px; height: 130px; top: 5%; right: 5%; }
        .shop { width: 110px; height: 110px; top: 38%; left: 38%; border-style: dashed; }
        .announcement { width: 160px; height: 80px; bottom: 15%; left: 0%; border-radius: 40px; }
        .chatbot { width: 130px; height: 130px; bottom: 5%; right: 5%; }

        .node-text { font-weight: bold; font-size: 0.9rem; }

        footer { margin-top: auto; padding: 20px; font-family: monospace; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

<header>
    <h1>AXON CORE</h1>
    <div class="slogan">Character is the Code</div>
</header>

<div class="neural-map">
    
    <a href="hall.html" class="alias hall">
        <div class="node-text">HALL OF FAME</div>
    </a>

    <a href="academy.html" class="alias academy">
        <div class="node-text">AXON ACADEMY</div>
    </a>

    <a href="shop.html" class="alias shop">
        <div class="node-text">SHOP</div>
    </a>

    <a href="news.html" class="alias announcement">
        <div class="node-text">ANNOUNCEMENTS</div>
    </a>

    <a href="chat.html" class="alias chatbot">
        <div class="node-text">CHATBOT<br><small>DIAGNOSTIC</small></div>
    </a>

</div>

<footer>
    [SYSTEM STATUS: ONLINE] • axon@gritheroes.vip
</footer>

</body>
</html>
